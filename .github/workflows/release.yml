name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version consistency
        run: node scripts/version.mjs
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: |
            .cache/ffmpeg
            src-tauri/binaries/windows
          key: ffmpeg-release-windows-${{ hashFiles('scripts/ffmpeg.lock.json', 'scripts/fetch-ffmpeg.mjs') }}
      - uses: actions/cache@v6
        if: runner.os == 'macOS'
        with:
          path: src-tauri/binaries/macos
          key: ffmpeg-release-macos-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg.lock.json', 'scripts/fetch-ffmpeg.mjs', 'scripts/build-ffmpeg-macos.sh') }}
      - name: Install FFmpeg build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
      - name: Validate ffmpeg lock
        run: node scripts/fetch-ffmpeg.mjs --validate-lock
      - name: Fetch bundled ffmpeg (LGPL, pinned)
        run: node scripts/fetch-ffmpeg.mjs
      - name: Verify bundled ffmpeg binary (macOS)
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-ffmpeg-macos.mjs --self-test
          node scripts/verify-ffmpeg-macos.mjs --binary src-tauri/binaries/macos/ffmpeg-aarch64-apple-darwin --smoke
      - name: Report bundled ffmpeg metadata (macOS)
        if: runner.os == 'macOS'
        run: |
          node -e 'const stamp=require("./src-tauri/binaries/macos/ffmpeg-aarch64-apple-darwin.build.json"); console.log("ffmpeg=" + stamp.ffmpeg.version + " lame=" + stamp.lame.version + " buildConfig=" + stamp.buildConfigSha256);'
          src-tauri/binaries/macos/ffmpeg-aarch64-apple-darwin -hide_banner -version | sed -n '1,2p'
          stat -f 'sidecarBytes=%z' src-tauri/binaries/macos/ffmpeg-aarch64-apple-darwin
      - name: Build app and bundles
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Verify bundled ffmpeg package (macOS)
        if: runner.os == 'macOS'
        run: |
          mount_dir="$RUNNER_TEMP/bilidown-dmg"
          mkdir -p "$mount_dir"
          dmg="$(find target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" -quiet || true' EXIT
          node scripts/verify-ffmpeg-macos.mjs --app "$mount_dir/bilidown.app" --smoke
      - name: Report macOS package size
        if: runner.os == 'macOS'
        run: |
          du -sh target/release/bundle/macos/bilidown.app
          du -h target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums（统一多平台 SHA256SUMS.txt）
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.exe dist/SHA256SUMS.txt \
            --title "bilidown ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag
