name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Version consistency
        run: node scripts/version.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Validate Windows uninstall hook
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          ./scripts/test-uninstall-hook.ps1

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: |
            .cache/ffmpeg
            src-tauri/binaries/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/ffmpeg.lock.json', 'scripts/fetch-ffmpeg.mjs') }}
      - uses: actions/cache@v6
        if: runner.os == 'macOS'
        with:
          path: src-tauri/binaries/macos
          key: ffmpeg-macos-${{ runner.arch }}-${{ hashFiles('scripts/ffmpeg.lock.json', 'scripts/fetch-ffmpeg.mjs', 'scripts/build-ffmpeg-macos.sh') }}
      - name: Install FFmpeg build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
      - name: Validate ffmpeg lock
        run: node scripts/fetch-ffmpeg.mjs --validate-lock
      - name: Prepare bundled ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: node scripts/fetch-ffmpeg.mjs windows-x64
      - name: Prepare bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: node scripts/fetch-ffmpeg.mjs macos-arm64
      - name: Verify bundled ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          node scripts/verify-ffmpeg-macos.mjs --self-test
          node scripts/verify-ffmpeg-macos.mjs --binary src-tauri/binaries/macos/ffmpeg-aarch64-apple-darwin --smoke
      - name: Check shell (platform gates)
        run: cargo check -p bilidown-app
      - name: Core tests
        run: cargo test -p bilidown-core
      - name: Shell tests
        run: cargo test -p bilidown-app
      - name: Shadow resource lifecycle (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p bilidown-app repeated_shadow_show_resize_hide_and_destroy_does_not_leak_gui_resources -- --ignored --test-threads=1
