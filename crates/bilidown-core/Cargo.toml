[package]
name = "bilidown-core"
version = "0.1.0"
edition = "2024"
description = "bilidown 核心：B 站 API/WBI/登录/下载/合并/任务/存储（无 UI 依赖）"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "gzip", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
md-5 = { version = "0.11", default-features = false }
qrcode = "0.14"
dirs = "7"
futures-util = "0.3"
tokio-util = "0.7"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
toml = "1.1"
rand = "0.8"
rsa = "0.9"
hmac = "0.13"
sha2 = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
wiremock = "0.6"
